receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 5s
    send_batch_size: 256

exporters:
  # 本地验收只输出结构化 Trace 摘要。生产应替换为受控的 Tempo/Jaeger/OTLP 后端，
  # 并在 Collector 侧再次执行属性白名单和访问控制。
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
