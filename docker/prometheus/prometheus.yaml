global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: rag-notes-agent
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
    # 本地 observability profile 不提供 metrics token。生产必须在网络层限制抓取来源，
    # 或以部署端模板注入 X-Metrics-Token；不要把 Token 写入仓库的 Prometheus 配置。
