name: quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: 安装后端依赖
        run: uv sync --locked --extra dev --extra postgres
      - name: Ruff 检查
        run: uv run ruff check app tests scripts
      - name: Pyright 类型检查
        run: uv run pyright app tests scripts
      - name: 后端测试
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: 格式检查
        run: npm run format
      - name: 生产构建
        run: npm run build

  evaluation-contract:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 评测与运行脚本语法检查
        run: python -m compileall -q scripts
      - name: 评测报告与质量门禁测试
        run: uv run pytest -q tests/test_evaluation_manifest.py tests/test_evaluation_gate.py tests/test_production_tooling.py
