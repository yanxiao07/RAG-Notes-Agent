name: release-package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source release archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix="RAG-Notes-Agent/" --output="RAG-Notes-Agent-${VERSION}.zip" "${GITHUB_SHA}"
      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: RAG-Notes-Agent-*.zip
